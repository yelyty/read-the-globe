<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFD" />
    <script>
      // one theme switch: data-theme is set before paint, from the saved choice (ThemeButton saves "light" or "dark")
      // or else the system setting, and follows the system until the reader picks
      (() => {
        const root = document.documentElement;
        const dark = matchMedia('(prefers-color-scheme: dark)');
        const saved = () => {
          try {
            return localStorage.getItem('rtg-theme');
          } catch {
            return null;
          }
        };
        const set = () => {
          const picked = saved();
          const theme =
            picked === 'light' || picked === 'dark'
              ? picked
              : dark.matches
                ? 'dark'
                : 'light';
          root.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').content =
            theme === 'dark' ? '#1C1811' : '#FFFFFD';
        };
        set();
        dark.addEventListener('change', () => {
          if (!saved()) set();
        });
      })();
    </script>
    <title>Read The Globe</title>
    <meta
      name="description"
      content="Log a novel and your atlas marks two countries: the one the story is set in, and the one its author calls home. Free, and no card needed."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Read The Globe" />
    <meta
      property="og:title"
      content="Read The Globe: where have your books taken you?"
    />
    <meta
      property="og:description"
      content="Log a novel and your atlas marks two countries: the one the story is set in, and the one its author calls home. Over years of reading, you can see how much of the world you’ve reached."
    />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Read The Globe: where have your books taken you?"
    />
    <meta
      name="twitter:description"
      content="Log a novel and your atlas marks two countries: where the story is set, and where its author calls home."
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;1,400&family=Alegreya+Sans:wght@400;500;800&family=IM+Fell+English&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
