name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # the tests never reach Supabase, but importing its client needs a URL and key to exist;
      # coverage fails the job when it drops under the thresholds in vite.config.ts
      - run: pnpm test:coverage
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # writes the coverage badge to the badges branch; README reads it through shields.io
  # a separate job so only this one can push, and only after master's tests pass
  badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Push the coverage badge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir badges
          node -e '
            const { total } = require("./coverage/coverage-summary.json");
            const pct = total.lines.pct;
            const color = pct >= 90 ? "brightgreen" : pct >= 75 ? "green" : pct >= 60 ? "yellow" : "red";
            const badge = { schemaVersion: 1, label: "coverage", message: `${pct}%`, color };
            require("fs").writeFileSync("badges/coverage.json", JSON.stringify(badge));
          '
          cd badges
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "Update coverage badge"
          # the branch only ever holds this one file, so each run replaces it
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" badges
